name: Nightly Verification

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"

      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt

      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical Nightly verification
        run: npm run verify:nightly

      - name: Upload Nightly evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-verification-evidence-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14
