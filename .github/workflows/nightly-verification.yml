name: Nightly Verification

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Nightly Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check full-tree heavy test classification
        run: python tools/check_heavy_test_classification.py

      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run Nightly metadata contracts
        run: npm run verify:local-infra
      - name: Upload Nightly metadata evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-metadata-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  p4-full:
    name: Nightly P4.3 Full Producer
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      evidence_id: ${{ steps.evidence.outputs.evidence_id }}
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          New-Item -ItemType Directory -Force -Path $env:WHEELHOUSE_DIR | Out-Null
          python -m pip download -r requirements-dev.lock.txt --dest $env:WHEELHOUSE_DIR
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$env:WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Run P4.3 exact full policy producer
        run: npm run verify:p4:p4-3
      - name: Capture exact P4 evidence identity
        id: evidence
        run: |
          $evidencePath = ".runtime/reports/generated/p4-state-actions/P4.3/state-writer-policy-evidence.json"
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ($evidence.verificationIdentity.verificationSha -ne "${{ github.sha }}") {
            throw "P4 evidence SHA does not match github.sha"
          }
          "evidence_id=$($evidence.evidenceId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Upload exact P4 producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-p4-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .runtime/reports/generated/p4-state-actions/P4.0/**
            .runtime/reports/generated/p4-state-actions/P4.3/**
          if-no-files-found: error
          retention-days: 14

  linux-core:
    name: Nightly Linux Core ${{ matrix.shard }}/3
    needs: ["p4-full"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
      STATE_WRITER_POLICY_EVIDENCE_MODE: strict
      STATE_WRITER_POLICY_EVIDENCE_PATH: .runtime/reports/generated/p4-state-actions/P4.3/state-writer-policy-evidence.json
      STATE_WRITER_POLICY_EVIDENCE_ID: ${{ needs['p4-full'].outputs.evidence_id }}
      STATE_WRITER_POLICY_LIVE_FALLBACK: forbid
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Download exact P4 producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/reports/generated/p4-state-actions
      - name: Validate exact P4 producer evidence
        run: node tools/verification/state_writer_policy_evidence.mjs validate --evidence "$STATE_WRITER_POLICY_EVIDENCE_PATH" --expected-id "$STATE_WRITER_POLICY_EVIDENCE_ID" --phase P4.3
      - name: Run balanced Linux core shard
        run: npm run verify:nightly:linux-core -- --shard-index ${{ matrix.shard }} --shard-count 3 --json-out .runtime/reports/generated/nightly/linux-core-${{ matrix.shard }}.json --md-out .runtime/reports/generated/nightly/linux-core-${{ matrix.shard }}.md --profile-out .runtime/reports/generated/nightly/linux-core-${{ matrix.shard }}-profile.json
      - name: Upload Linux core shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-linux-core-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Nightly Browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Nightly browser shard
        run: npm run test:e2e:sample-guide
      - name: Upload Nightly browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-browser-${{ github.run_id }}
          path: |
            .runtime/browser/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  scenario-heavy:
    name: Nightly Scenario Heavy
    needs: ["p4-full"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
      STATE_WRITER_POLICY_EVIDENCE_MODE: strict
      STATE_WRITER_POLICY_EVIDENCE_PATH: .runtime/reports/generated/p4-state-actions/P4.3/state-writer-policy-evidence.json
      STATE_WRITER_POLICY_EVIDENCE_ID: ${{ needs['p4-full'].outputs.evidence_id }}
      STATE_WRITER_POLICY_LIVE_FALLBACK: forbid
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"
      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt
      - name: Check minimal CI dependency guardrails
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Download exact P4 producer evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: .runtime/reports/generated/p4-state-actions
      - name: Validate exact P4 producer evidence
        run: node tools/verification/state_writer_policy_evidence.mjs validate --evidence "$STATE_WRITER_POLICY_EVIDENCE_PATH" --expected-id "$STATE_WRITER_POLICY_EVIDENCE_ID" --phase P4.3
      - name: Run strict scenario contracts
        run: npm run verify:scenario-contracts:strict
      - name: Run full Python regression discovery
        run: npm run python -- -m unittest discover -s tests -p "test_*.py"
      - name: Upload scenario-heavy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-scenario-heavy-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  windows-governance:
    name: Nightly Windows Governance
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: scenario-forge-system-power-scheme
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Williams governance contracts
        run: npm run test:node:williams-crossover-governance
      - name: Run Williams Job runner integration
        run: npm run test:node:williams-crossover-job-runner
      - name: Run Windows Job V2 contracts
        run: npm run test:node:windows-job-runtime
      - name: Run Windows Job V2 runtime integration
        run: npm run test:node:windows-job-runtime:integration
      - name: Run bounded power-scheme live preflight
        run: npm run perf:williams-power-scheme:live-preflight
      - name: Run bounded telemetry live lane
        run: npm run test:node:williams-crossover-telemetry-live
      - name: Upload Windows governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-windows-governance-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14

  final:
    name: Nightly Final Aggregator
    if: always()
    needs: ["metadata", "linux-core", "browser", "scenario-heavy", "p4-full", "windows-governance"]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize Nightly shard results
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const expectedJobs = ["metadata", "linux-core", "browser", "scenario-heavy", "p4-full", "windows-governance"];
          const needs = JSON.parse(process.env.REQUIRED_RESULTS);
          const actualJobs = Object.keys(needs).sort();
          const expectedJobsSorted = [...expectedJobs].sort();
          const dependencySetMatches = JSON.stringify(actualJobs) === JSON.stringify(expectedJobsSorted);
          const rows = expectedJobs.map((job) => `| ${job} | ${needs[job]?.result ?? "missing"} |`);
          const summary = ["## Nightly shard results", "", "| Job | Result |", "| --- | --- |", ...rows, ""].join("\n");
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          const rejected = expectedJobs.filter((job) => needs[job]?.result !== "success");
          if (!dependencySetMatches || rejected.length > 0) {
            console.error(`Nightly verification failed: ${rejected.join(", ") || "dependency set mismatch"}`);
            process.exit(1);
          }
          NODE
