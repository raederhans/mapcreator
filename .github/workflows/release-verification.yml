name: Release Verification

on:
  workflow_dispatch:
    inputs:
      pages_url:
        description: "Approved deployed Pages URL to verify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
      PLAYWRIGHT_BROWSERS_PATH: .runtime/browser/ms-playwright
      SCENARIO_FORGE_PAGES_URL: ${{ inputs.pages_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate Pages URL authority
        shell: bash
        run: |
          if [ -z "${SCENARIO_FORGE_PAGES_URL//[[:space:]]/}" ]; then
            echo "::error::pages_url must contain a non-whitespace Pages URL"
            exit 2
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download Python wheel cache
        run: |
          mkdir -p "$WHEELHOUSE_DIR"
          python -m pip download -r requirements-dev.lock.txt --dest "$WHEELHOUSE_DIR"

      - name: Install Python test dependencies
        run: python -m pip install --no-index --find-links "$WHEELHOUSE_DIR" -r requirements-dev.lock.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical Release verification
        run: npm run verify:release

      - name: Upload Release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification-evidence-${{ github.run_id }}
          path: |
            .runtime/reports/generated/**
            .runtime/reports/**
            .runtime/tests/**
          if-no-files-found: ignore
          retention-days: 14
