name: P4 Nightly Selective Repair

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Nightly Verification run id at the exact same SHA/tree
        required: true
        type: string
      rerun_scope:
        description: failed or a comma-separated set of P4 authority roles
        required: true
        default: failed
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: p4-nightly-selective-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan exact-identity repair
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_tree: ${{ steps.plan.outputs.source_tree }}
      source_attempt: ${{ steps.plan.outputs.source_attempt }}
      execute_count: ${{ steps.plan.outputs.execute_count }}
      reuse_count: ${{ steps.plan.outputs.reuse_count }}
      execute_matrix: ${{ steps.plan.outputs.execute_matrix }}
      checker_disposition: ${{ steps.plan.outputs.checker_disposition }}
      full_disposition: ${{ steps.plan.outputs.full_disposition }}
      fast_disposition: ${{ steps.plan.outputs.fast_disposition }}
    steps:
      - name: Checkout repair candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Fetch exact source run metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "::error::source_run_id must be numeric"; exit 2 ;;
          esac
          mkdir -p .runtime/tmp/p4-repair
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID" \
            > .runtime/tmp/p4-repair/source-run.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" \
            > .runtime/tmp/p4-repair/source-jobs.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > .runtime/tmp/p4-repair/source-artifacts.json
      - name: Build fail-closed repair plan
        id: plan
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RERUN_SCOPE: ${{ inputs.rerun_scope }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          TREE_SHA=$(git rev-parse 'HEAD^{tree}')
          PLANNER_DIGEST=$(sha256sum tools/verification/p4_nightly_repair.mjs | cut -d ' ' -f 1)
          RESOLVER_DIGEST=$(sha256sum tools/verification/p4_nightly_receipt_resolver.mjs | cut -d ' ' -f 1)
          CLOSEOUT_DIGEST=$(sha256sum tools/verification/p4_nightly_closeout.mjs | cut -d ' ' -f 1)
          node tools/verification/p4_nightly_repair.mjs \
            --source-run-id "$SOURCE_RUN_ID" \
            --current-run-id "$CURRENT_RUN_ID" \
            --rerun-scope "$RERUN_SCOPE" \
            --expected-sha "$EXPECTED_SHA" \
            --expected-tree "$TREE_SHA" \
            --source-run .runtime/tmp/p4-repair/source-run.json \
            --source-jobs .runtime/tmp/p4-repair/source-jobs.json \
            --source-artifacts .runtime/tmp/p4-repair/source-artifacts.json \
            --planner-digest "$PLANNER_DIGEST" \
            --resolver-digest "$RESOLVER_DIGEST" \
            --closeout-digest "$CLOSEOUT_DIGEST" \
            --out .runtime/reports/generated/nightly/p4-repair-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload exact repair plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-nightly-repair-plan-${{ github.run_id }}
          path: .runtime/reports/generated/nightly/p4-repair-plan.json
          if-no-files-found: error
          retention-days: 14

  reuse:
    name: Reuse exact passing receipts
    needs: plan
    if: needs.plan.outputs.reuse_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair identity
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Download exact repair plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-nightly-repair-plan-${{ github.run_id }}
          path: .runtime/repair/plan
      - name: Download exact checker receipt
        if: needs.plan.outputs.checker_disposition == 'reused-exact-prior-run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-checker-boundaries-${{ needs.plan.outputs.source_sha }}-${{ needs.plan.outputs.source_attempt }}
          path: .runtime/repair/reused/checker
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Validate exact checker receipt
        if: needs.plan.outputs.checker_disposition == 'reused-exact-prior-run'
        run: |
          node tools/verification/p4_nightly_receipt_resolver.mjs \
            --receipt .runtime/repair/reused/checker/nightly/p4-checker-boundaries.json \
            --role checker-boundaries \
            --expected-sha "${{ needs.plan.outputs.source_sha }}" \
            --expected-tree "${{ needs.plan.outputs.source_tree }}" \
            --repair-plan .runtime/repair/plan/p4-repair-plan.json \
            --current-run-id "${{ github.run_id }}" \
            --out .runtime/repair/reused/checker/nightly/p4-checker-boundaries.resolved.json
      - name: Publish reused checker authority
        if: needs.plan.outputs.checker_disposition == 'reused-exact-prior-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-nightly-repair-checker-boundaries-${{ github.run_id }}
          path: .runtime/repair/reused/checker/**
          if-no-files-found: error
          retention-days: 14
      - name: Download exact full-policy receipt
        if: needs.plan.outputs.full_disposition == 'reused-exact-prior-run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-full-policy-${{ needs.plan.outputs.source_sha }}-${{ needs.plan.outputs.source_attempt }}
          path: .runtime/repair/reused/full
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Validate exact full-policy receipt
        if: needs.plan.outputs.full_disposition == 'reused-exact-prior-run'
        run: |
          node tools/verification/p4_nightly_receipt_resolver.mjs \
            --receipt .runtime/repair/reused/full/nightly/p4-full-policy-tap.json \
            --role full-policy-tap \
            --expected-sha "${{ needs.plan.outputs.source_sha }}" \
            --expected-tree "${{ needs.plan.outputs.source_tree }}" \
            --repair-plan .runtime/repair/plan/p4-repair-plan.json \
            --current-run-id "${{ github.run_id }}" \
            --out .runtime/repair/reused/full/nightly/p4-full-policy-tap.resolved.json
      - name: Publish reused full-policy authority
        if: needs.plan.outputs.full_disposition == 'reused-exact-prior-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-nightly-repair-full-policy-tap-${{ github.run_id }}
          path: .runtime/repair/reused/full/**
          if-no-files-found: error
          retention-days: 14
      - name: Download exact fast receipt
        if: needs.plan.outputs.fast_disposition == 'reused-exact-prior-run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-p4-fast-${{ needs.plan.outputs.source_sha }}-${{ needs.plan.outputs.source_attempt }}
          path: .runtime/repair/reused/fast
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Validate exact fast receipt
        if: needs.plan.outputs.fast_disposition == 'reused-exact-prior-run'
        run: |
          node tools/verification/p4_nightly_receipt_resolver.mjs \
            --receipt .runtime/repair/reused/fast/nightly/p4-fast-contracts-routes.json \
            --role fast-contracts-routes \
            --expected-sha "${{ needs.plan.outputs.source_sha }}" \
            --expected-tree "${{ needs.plan.outputs.source_tree }}" \
            --repair-plan .runtime/repair/plan/p4-repair-plan.json \
            --current-run-id "${{ github.run_id }}" \
            --out .runtime/repair/reused/fast/nightly/p4-fast-contracts-routes.resolved.json
      - name: Publish reused fast authority
        if: needs.plan.outputs.fast_disposition == 'reused-exact-prior-run'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-nightly-repair-fast-contracts-routes-${{ github.run_id }}
          path: .runtime/repair/reused/fast/**
          if-no-files-found: error
          retention-days: 14

  execute:
    name: Execute selected authority - ${{ matrix.role }}
    needs: plan
    if: needs.plan.outputs.execute_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.execute_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      WHEELHOUSE_DIR: .runtime/python/wheels
    steps:
      - name: Checkout exact repair identity
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Python for checker boundaries
        if: matrix.role == 'checker-boundaries'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Download checker Python dependencies
        if: matrix.role == 'checker-boundaries'
        run: |
          New-Item -ItemType Directory -Force $env:WHEELHOUSE_DIR | Out-Null
          python -m pip download -r requirements-dev.lock.txt --dest $env:WHEELHOUSE_DIR
      - name: Install checker Python dependencies
        if: matrix.role == 'checker-boundaries'
        run: python -m pip install --no-index --find-links $env:WHEELHOUSE_DIR -r requirements-dev.lock.txt
      - name: Check checker dependency guardrails
        if: matrix.role == 'checker-boundaries'
        run: python tools/check_min_ci_requirements.py
      - name: Install Node dependencies
        run: npm ci
      - name: Download exact repair plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-nightly-repair-plan-${{ github.run_id }}
          path: .runtime/repair/plan
      - name: Execute selected authority once
        run: node tools/verification/p4_nightly_authority.mjs --role "${{ matrix.role }}" --out ".runtime/reports/generated/nightly/p4-${{ matrix.role }}.json"
      - name: Bind executed receipt to current repair run
        shell: bash
        run: |
          node tools/verification/p4_nightly_receipt_resolver.mjs \
            --receipt ".runtime/reports/generated/nightly/p4-${{ matrix.role }}.json" \
            --role "${{ matrix.role }}" \
            --expected-sha "${{ needs.plan.outputs.source_sha }}" \
            --expected-tree "${{ needs.plan.outputs.source_tree }}" \
            --repair-plan .runtime/repair/plan/p4-repair-plan.json \
            --current-run-id "${{ github.run_id }}" \
            --out ".runtime/reports/generated/nightly/p4-${{ matrix.role }}.resolved.json"
      - name: Publish executed authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-nightly-repair-${{ matrix.role }}-${{ github.run_id }}
          path: .runtime/reports/generated/**
          if-no-files-found: error
          retention-days: 14

  closeout:
    name: Close out mixed-origin authorities
    needs: ["plan", "reuse", "execute"]
    if: >-
      always()
      && needs.plan.result == 'success'
      && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
      && (needs.execute.result == 'success' || needs.execute.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair identity
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Download repair plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-nightly-repair-plan-${{ github.run_id }}
          path: .runtime/repair/plan
      - name: Download checker authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-nightly-repair-checker-boundaries-${{ github.run_id }}
          path: .runtime/repair/authorities/checker
      - name: Download full-policy authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-nightly-repair-full-policy-tap-${{ github.run_id }}
          path: .runtime/repair/authorities/full
      - name: Download fast authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p4-nightly-repair-fast-contracts-routes-${{ github.run_id }}
          path: .runtime/repair/authorities/fast
      - name: Validate mixed-origin exact closeout
        run: |
          node tools/verification/p4_nightly_closeout.mjs \
            --authority .runtime/repair/authorities/checker/nightly/p4-checker-boundaries.json \
            --authority .runtime/repair/authorities/full/nightly/p4-full-policy-tap.json \
            --authority .runtime/repair/authorities/fast/nightly/p4-fast-contracts-routes.json \
            --resolved-authority .runtime/repair/authorities/checker/nightly/p4-checker-boundaries.resolved.json \
            --resolved-authority .runtime/repair/authorities/full/nightly/p4-full-policy-tap.resolved.json \
            --resolved-authority .runtime/repair/authorities/fast/nightly/p4-fast-contracts-routes.resolved.json \
            --expected-sha "${{ needs.plan.outputs.source_sha }}" \
            --expected-tree "${{ needs.plan.outputs.source_tree }}" \
            --evidence .runtime/repair/authorities/checker/p4-state-actions/P4.3/state-writer-policy-evidence.json \
            --tap .runtime/repair/authorities/full/p4-state-actions/P4.0/state-writer-policy-tests.tap \
            --completed .runtime/repair/authorities/full/p4-state-actions/P4.0/state-writer-policy-tests.completed.json \
            --repair-plan .runtime/repair/plan/p4-repair-plan.json \
            --current-run-id "${{ github.run_id }}" \
            --out .runtime/reports/generated/nightly/p4-repair-closeout.json
      - name: Upload mixed-origin closeout
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-nightly-repair-closeout-${{ github.run_id }}
          path: .runtime/reports/generated/nightly/p4-repair-closeout.json
          if-no-files-found: error
          retention-days: 14
