    <rect x="578" y="76" width="556" height="42" rx="26" fill="#06101c" fill-opacity=".92" />
    <circle cx="603" cy="97" r="5" fill="#d99a45" /><circle cx="620" cy="97" r="5" fill="#147f77" /><circle cx="637" cy="97" r="5" fill="#5eead4" />
    <text x="666" y="103" fill="#c8d9dc" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">GENERATED ATLAS  /  POLITICAL BASELINE</text>
    <rect x="602" y="493" width="508" height="38" rx="12" fill="#06101c" fill-opacity=".88" stroke="#5eead4" stroke-opacity=".18" />
    <text x="622" y="518" fill="#dfeef0" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HOI4 1936</text>
    <text x="742" y="518" fill="#8ca9ad" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="13">ownership  •  borders  •  capital markers</text>
