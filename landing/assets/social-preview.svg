<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" data-social-preview="scenario-forge">
  <title id="title">Scenario Forge — Forge political maps that feel alive.</title>
  <desc id="desc">A dark cartographic preview of the Scenario Forge scenario-first political map workbench.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#0d2530" />
    </linearGradient>
    <radialGradient id="map-sea" cx="52%" cy="46%" r="78%">
      <stop offset="0" stop-color="#244a68" />
      <stop offset="1" stop-color="#071522" />
    </radialGradient>
    <linearGradient id="logo-mark" x1="8" y1="8" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset="1" stop-color="#d99a45" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="graticule" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(-9)">
      <path d="M0 0H72M0 36H72M0 72H72M0 0V72M36 0V72M72 0V72" fill="none" stroke="#c4e3e2" stroke-opacity=".1" stroke-width="1" />
    </pattern>
    <clipPath id="map-clip"><rect x="578" y="76" width="556" height="478" rx="26" /></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="28" y="28" width="1144" height="574" rx="32" fill="none" stroke="#5eead4" stroke-opacity=".16" />

  <g transform="translate(72 62)" aria-hidden="true">
    <rect width="50" height="50" rx="15" fill="#f5f1ea" />
    <rect x="7" y="7" width="36" height="36" rx="11" fill="#101928" />
    <circle cx="17" cy="17" r="5" fill="url(#logo-mark)" />
    <path d="M14 33c7-7 17-11 29-12" fill="none" stroke="#f4ede4" stroke-width="6" stroke-linecap="round" />
    <path d="M14 33c7-7 17-11 29-12" fill="none" stroke="url(#logo-mark)" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="138" y="95" fill="#f4ede4" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-.4">Scenario Forge</text>
  <text x="72" y="224" fill="#f4ede4" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.8">Forge political maps</text>
  <text x="72" y="292" fill="#d99a45" font-family="Fraunces, Georgia, serif" font-size="66" font-weight="700" letter-spacing="-1.2">that feel alive.</text>
  <rect x="74" y="326" width="72" height="4" rx="2" fill="#147f77" />
  <text x="72" y="374" fill="#b9cbd0" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">Scenario-first political maps for</text>
  <text x="72" y="408" fill="#b9cbd0" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">alternate history and strategy stories.</text>
  <text x="72" y="520" fill="#5eead4" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.7">WORLD STATES  /  OWNERSHIP  /  CONTEXT  /  EXPORT</text>

