      <rect x="578" y="76" width="556" height="478" fill="url(#graticule)" />
      <path d="M657 187 704 143 773 137 823 164 885 153 944 185 1025 196 1088 250 1094 322 1061 358 1069 426 1016 479 945 469 903 436 848 443 809 405 757 390 737 345 678 325 648 274Z" fill="#7d958f" fill-opacity=".36" stroke="#d8e7df" stroke-opacity=".68" stroke-width="2" />
      <path d="M665 187 704 143 767 143 774 208 732 237 682 225Z" fill="#36a79c" stroke="#071522" stroke-width="2" />
      <path d="m774 143 49 21 11 61-60-17-42 29 7-65Z" fill="#c2c6d7" stroke="#071522" stroke-width="2" />
      <path d="m834 226 60-62 51 21-13 71-56 19-41-23Z" fill="#d99a45" stroke="#071522" stroke-width="2" />
      <path d="m932 185 93 11 63 54-47 45-66-39-56 7 13-71Z" fill="#952d66" stroke="#071522" stroke-width="2" />
      <path d="m682 225 50 12 42 46-32 51-65-9-29-51 34-49Z" fill="#147f77" stroke="#071522" stroke-width="2" />
      <path d="m774 208 60 17 41 23-10 72-58 14-65-51 32-51Z" fill="#5e8583" stroke="#071522" stroke-width="2" />
      <path d="m905 270 56-7 66 39-36 67-68 12-30-39 12-72Z" fill="#b55f3b" stroke="#071522" stroke-width="2" />
      <path d="m770 324 58-14 58 18 30 39-13 58-54 18-46-38-52-30 19-51Z" fill="#c1ab08" stroke="#071522" stroke-width="2" />
      <path d="M645 398c72-66 164-73 263-33 67 27 120 31 180 2" fill="none" stroke="#5eead4" stroke-opacity=".42" stroke-width="2" stroke-dasharray="7 9" />
      <g filter="url(#soft-glow)" fill="#f4ede4" stroke="#071522" stroke-width="3">
        <circle cx="725" cy="219" r="6" /><circle cx="870" cy="246" r="6" /><circle cx="950" cy="300" r="6" /><circle cx="835" cy="353" r="6" />
      </g>
      <g fill="#f4ede4" font-family="Arial, sans-serif" font-size="13" font-weight="800" paint-order="stroke" stroke="#071522" stroke-width="4">
        <text x="737" y="216">BER</text><text x="882" y="243">WAR</text><text x="962" y="297">ROM</text><text x="847" y="350">VIE</text>
      </g>
